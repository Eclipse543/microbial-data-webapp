<!DOCTYPE html>
<html>
<head>
    <title>Microbial Data Web App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
        }

        h1 {
            margin-bottom: 30px;
        }

        a {
            margin-right: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Microbial Data Web App</h1>

    <nav>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="/culture/add/">Add Culture</a>
        <a href="/culture/">Culture Results</a>
        <form method="post" action="{% url 'logout' %}">
        	 {% csrf_token %}
   		 <button type="submit">Logout</button>
	</form>
    </nav>

    <hr>
</div>
<nav>

    {% if user.is_authenticated %}

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        |

        <a href="{% url 'add_culture' %}">
            Add Culture
        </a>

        |

        <a href="{% url 'culture_list' %}">
            View Records
        </a>

        |

        <form
            method="post"
            action="{% url 'logout' %}"
            style="display:inline;"
        >
            {% csrf_token %}

            <button type="submit">
                Logout
            </button>

        </form>

    {% endif %}

</nav>

<hr>
</body>
</html>
{% block content %}
{% endblock %}
