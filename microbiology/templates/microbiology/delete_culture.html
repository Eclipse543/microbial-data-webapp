{% extends "microbiology/base.html" %}

{% block content %}

<h1>Delete Culture Record</h1>

<p>
    Are you sure you want to delete:
</p>

<p>
    <strong>{{ record.sample_id }}</strong>
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'culture_list' %}">
        Cancel
    </a>

</form>

{% endblock %}
